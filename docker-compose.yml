# Full local stack: PostgreSQL (pgvector), Kafka, the telecom MCP server and the agent API.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: noc
      POSTGRES_DB: noc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mcp-server:
    build: .
    command: ["python", "-m", "app.mcp_server.server", "--http", "8001"]
    environment:
      DATABASE_URL: postgresql://postgres:noc@postgres:5432/noc
      RESET_DB: "true"          # seeds the mock network on start
    ports: ["8001:8001"]
    healthcheck:
      # the port opens only after the database is seeded
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 2)"]
      interval: 3s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:noc@postgres:5432/noc
      RESET_DB: "false"
      MCP_SERVER: http://mcp-server:8001/mcp
      EVENT_BUS: kafka
      KAFKA_BOOTSTRAP: kafka:9092
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      mcp-server: {condition: service_healthy}
      kafka: {condition: service_started}
