[project]
name = "telco-assurance-agent"
version = "1.0.0"
description = "Agentic RCA and closed-loop remediation for 5G Core, EPC and IMS"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
